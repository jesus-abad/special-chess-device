name: Build SC Device firmware

on:
  push:
    branches:
      - "sc-device-*"
  workflow_dispatch:

jobs:
  build-tab5:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch M5Stack dependencies
        shell: bash
        run: |
          mkdir -p dependencies
          git clone --depth 1 -b v2.1.0 https://github.com/Forairaaaaa/mooncake.git dependencies/mooncake
          git clone --depth 1 -b v1.0.0 https://github.com/Forairaaaaa/mooncake_log.git dependencies/mooncake_log
          git clone --depth 1 -b v9.2.2 https://github.com/lvgl/lvgl.git dependencies/lvgl
          git clone --depth 1 -b v2.0.0 https://github.com/Forairaaaaa/smooth_ui_toolkit.git dependencies/smooth_ui_toolkit

      - name: Build ESP32-P4 firmware
        working-directory: platforms/tab5
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py build

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: sc-device-tab5-firmware
          path: |
            platforms/tab5/build/bootloader/bootloader.bin
            platforms/tab5/build/partition_table/partition-table.bin
            platforms/tab5/build/m5stack_tab5.bin
            platforms/tab5/build/flash_args
          if-no-files-found: error
